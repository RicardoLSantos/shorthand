# Security Scan — gitleaks secret detection
#
# Complements .github/workflows/security-audit.yml, which greps the *current*
# tracked tree with hand-written patterns. This one reads git history, so a
# secret that was committed and later deleted is still detected — deleting a
# file does not remove it from history.
#
# SCOPE DEPENDS ON THE EVENT — `fetch-depth: 0` is necessary but NOT sufficient.
# gitleaks-action derives its range from the trigger, measured on 2026-08-11:
#   push / pull_request  → only the pushed range (`--log-opts=<base>^..<head>`).
#                          Run 31482331763 scanned 3 commits / 7.95 KB in 0.1s.
#                          This is the fast pre-merge gate, NOT a history scan.
#   schedule / dispatch  → no range flag, so the whole repository.
#                          Run 31482458639 scanned 504 commits / 1.45 GB in 64s.
# So the weekly run below is what actually answers "was a secret ever committed?".
# If you need that answer now, do not read a green push run — trigger it:
#   gh workflow run security-scan.yml --ref main
# and confirm the "N commits scanned" line matches the repository, not the push.
#
# Uses no third-party API keys and no Claude API: gitleaks runs entirely in the
# runner with the repository-scoped GITHUB_TOKEN.
#
# SCHEDULE FOR MAINTAINERS
#   security-scan  (this file)  weekly  — Mondays 07:00 UTC / 08:00 WEST
#   security-audit              daily   — 06:00 UTC / 07:00 WEST
#   conceptmap-drift            weekly  — Mondays 06:00 UTC
# A red run means: triage first (placeholder vs real), and if real, ROTATE the
# credential at the service. Removing the file does not remediate history.
#
# Created: 2026-08-11 (T1) — see knowledge_base/security/SECURITY_PROCESS.md in
# the Thesis repository for the detect → triage → remediate → verify process.

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC (08:00 WEST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — the point of this job

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings are printed redacted; values never appear in the log.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
